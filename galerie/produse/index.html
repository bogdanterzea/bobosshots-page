<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografie Produs & Auto | Bobosshots - Fotograf Sibiu</title>
    <meta name="description" content="Galerie fotografie de produs, automobile și imobiliare. Fotografii profesionale pentru afaceri, magazine online, showroom-uri auto. Terzea Bogdan Photography.">
    <meta name="keywords" content="fotografie produs sibiu, fotograf produse, fotografii auto, fotograf masini, fotografie imobiliara, poze produs magazin online">
    <meta name="author" content="Terzea Bogdan">
    <link rel="canonical" href="https://bobosshots.com/galerie/produse/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bobosshots.com/galerie/produse/">
    <meta property="og:title" content="Fotografie Produs | Bobosshots">
    <meta property="og:description" content="Fotografii profesionale de produs, automobile și imobiliare în Sibiu.">
    <meta property="og:image" content="https://bobosshots.com/portfolio/auto/thumbs/product-motorcycle.jpg">
    <meta property="og:locale" content="ro_RO">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fotografie Produs | Bobosshots">
    <meta name="twitter:image" content="https://bobosshots.com/portfolio/auto/thumbs/product-motorcycle.jpg">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a0a0a">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"ImageGallery","name":"Galerie Produse - Bobosshots","description":"Fotografie de produs, automobile și imobiliare","url":"https://bobosshots.com/galerie/produse/","author":{"@type":"Person","name":"Terzea Bogdan"}}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Language Switcher: pre-paint flag avoids RO flash when EN is the stored choice -->
    <script>try{if(localStorage.getItem('bs_lang')==='en')document.documentElement.setAttribute('data-lang-pending','1')}catch(e){}</script>
    <style>html[data-lang-pending] body{visibility:hidden}</style>
    <script defer src="/translations.js"></script>

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"></noscript>

    <!-- Font Awesome CSS - only solid + brands -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/solid.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/solid.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css">
    </noscript>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/shared/tailwind.css">

    <!-- GSAP + ScrollTrigger (defer) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Lenis Smooth Scroll (defer) -->
    <script defer src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <link rel="stylesheet" href="/shared/gallery-page.css">
</head>
<body class="bg-dark-900 text-white min-h-screen">
    <!-- Scroll Progress -->
    <div class="scroll-progress" id="scroll-progress"></div>
    <!-- Preloader -->
    <div class="preloader" id="preloader">
        <div class="preloader-logo"><span class="text-white">Bobos</span><span class="text-indigo-400">shots</span></div>
        <div class="preloader-bar"><div class="preloader-progress"></div></div>
    </div>
    <!-- Subtle Cursor Glow -->
    <div class="cursor-glow" id="cursor-glow"></div>

    <!-- Header -->
    <header class="py-6 px-4 sm:px-6 lg:px-8 border-b border-dark-700">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>
                Înapoi
            </a>
            <a href="/" class="text-2xl font-bold">
                <span class="text-white">Bobos</span><span class="text-indigo-400">shots</span>
            </a>
            <div class="w-20"></div>
        </div>
    </header>

    <main>
    <!-- Page Title -->
    <section class="py-16 text-center">
        <div class="w-20 h-20 bg-accent-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-box-open text-accent-primary text-3xl"></i>
        </div>
        <h1 class="text-4xl md:text-5xl font-bold mb-4">Produse & Imobiliare</h1>
        <p class="text-gray-400 max-w-xl mx-auto px-4">Fotografii comerciale de produse și imobiliare pentru apartamente, clădiri și proprietăți.</p>
    </section>

    <!-- Gallery Grid -->
    <section class="pb-24 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="gallery-item rounded-2xl cursor-pointer" onclick="openLightbox('/portfolio-backup/auto/product-motorcycle.jpg')">
                    <picture>
                        <source srcset="/portfolio/auto/thumbs/product-motorcycle.webp" type="image/webp">
                        <img src="/portfolio/auto/thumbs/product-motorcycle.jpg" alt="Kawasaki ZX-6R" class="w-full h-80 object-cover rounded-2xl" loading="lazy">
                    </picture>
                </div>
                <div class="gallery-item rounded-2xl cursor-pointer" onclick="openLightbox('/portfolio-backup/auto/product-moto-action.jpg')">
                    <picture>
                        <source srcset="/portfolio/auto/thumbs/product-moto-action.webp" type="image/webp">
                        <img src="/portfolio/auto/thumbs/product-moto-action.jpg" alt="Motocicletă în Acțiune" class="w-full h-80 object-cover rounded-2xl" loading="lazy">
                    </picture>
                </div>
                <div class="gallery-item rounded-2xl cursor-pointer" onclick="openLightbox('/portfolio-backup/auto/product-vintage-car.jpg')">
                    <picture>
                        <source srcset="/portfolio/auto/thumbs/product-vintage-car.webp" type="image/webp">
                        <img src="/portfolio/auto/thumbs/product-vintage-car.jpg" alt="Cadillac Vintage" class="w-full h-80 object-cover rounded-2xl" loading="lazy">
                    </picture>
                </div>
                <div class="gallery-item rounded-2xl cursor-pointer" onclick="openLightbox('/portfolio-backup/auto/product-sports-cars.jpg')">
                    <picture>
                        <source srcset="/portfolio/auto/thumbs/product-sports-cars.webp" type="image/webp">
                        <img src="/portfolio/auto/thumbs/product-sports-cars.jpg" alt="Mașini Sport" class="w-full h-80 object-cover rounded-2xl" loading="lazy">
                    </picture>
                </div>
            </div>
        </div>
    </section>

    <!-- CTA -->
    <section class="pb-24 text-center">
        <a href="https://instagram.com/bobosshots" target="_blank" rel="noopener noreferrer" class="inline-flex items-center bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500 text-white px-8 py-4 rounded-full font-semibold text-lg transition-all hover:scale-105 hover:shadow-lg hover:shadow-pink-500/25">
            <i class="fab fa-instagram text-xl mr-3"></i>Solicită Ofertă
        </a>
    </section>

    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()" role="dialog" aria-label="Vizualizare imagine">
        <button class="lightbox-btn absolute top-6 right-6 text-white text-xl z-10" onclick="closeLightbox()" aria-label="Închide"><i class="fas fa-times" aria-hidden="true"></i></button>
        <button id="lightbox-prev" class="lightbox-btn absolute left-6 top-1/2 -translate-y-1/2 text-white text-xl z-10" onclick="event.stopPropagation(); navigateLightbox(-1)" aria-label="Imaginea anterioară"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
        <div id="lightbox-spinner" class="absolute inset-0 flex items-center justify-center" style="display: none;"><div class="w-12 h-12 border-4 border-accent-primary border-t-transparent rounded-full animate-spin"></div></div>
        <img id="lightbox-img" src="" alt="Fotografie produs">
        <button id="lightbox-next" class="lightbox-btn absolute right-6 top-1/2 -translate-y-1/2 text-white text-xl z-10" onclick="event.stopPropagation(); navigateLightbox(1)" aria-label="Imaginea următoare"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-dark-800/80 backdrop-blur-sm px-4 py-2 rounded-full text-sm text-gray-300"><span id="lightbox-counter">1 / 4</span></div>
    </div>

    <script defer src="/shared/gallery-page.js"></script>
</body>
</html>
